<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-labelledby="svg-title"><title id="svg-title">Proyectos destacados de Domingo Berbel</title><defs><pattern id="scan" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000" opacity="0.18"/></pattern><filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".85" stop-color="#00ff41" stop-opacity=".09"/><stop offset="1" stop-color="#9cff93" stop-opacity=".22"/></linearGradient><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.ln{animation:enter 360ms ease-out both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1s step-end infinite}@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}.led{animation:led 1.8s ease-in-out infinite}@keyframes flick{0%{opacity:.985}50%{opacity:1}100%{opacity:.99}}.flick{animation:flick .12s infinite}@keyframes beam{from{transform:translateY(-70px)}to{transform:translateY(270px)}}.beam{animation:beam 10s linear 3s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="840" height="270" fill="#0e0e0e"/><g class="flick" filter="url(#bloom)"><text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#fcaf00">&gt;&#160;</tspan><tspan fill="#9cff93">ls -la projects/</tspan></text><g class="ln" style="animation-delay: