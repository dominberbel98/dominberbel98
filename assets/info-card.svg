<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="svg-title"><title id="svg-title">Ficha de perfil de Domingo Berbel</title><defs><pattern id="scan" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000" opacity="0.18"/></pattern><filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".85" stop-color="#00ff41" stop-opacity=".09"/><stop offset="1" stop-color="#9cff93" stop-opacity=".22"/></linearGradient><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><style>@keyframes enter{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}.ln{animation:enter 420ms cubic-bezier(.2,.8,.2,1) both}.l0{animation-delay:0ms}.l1{animation-delay:80ms}.l2{animation-delay:160ms}.l3{animation-delay:240ms}.l4{animation-delay:320ms}.l5{animation-delay:400ms}.l6{animation-delay:480ms}.l7{animation-delay:560ms}.l8{animation-delay:640ms}.l9{animation-delay:720ms}.l10{animation-delay:800ms}.l11{animation-delay:880ms}.l12{animation-delay:960ms}.l13{animation-delay:1040ms}@keyframes beam{from{transform:translateY(-70px)}to{transform:translateY(420px)}}.beam{animation:beam 8s linear 4s infinite}@keyframes flick{0%{opacity:.985}50%{opacity:1}100%{opacity:.99}}.flick{animation:flick .12s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="420" height="420" fill="#0e0e0e"/><g class="flick" filter="url(#bloom)"><text class="ln l0" x="16" y="30" font-family="ui-monospace, SFMono-Re