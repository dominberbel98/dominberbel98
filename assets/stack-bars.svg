<svg xmlns="http://www.w3.org/2000/svg" width="840" height="306" viewBox="0 0 840 306" role="img" aria-labelledby="svg-title"><title id="svg-title">Stack técnico de Domingo Berbel</title><defs><pattern id="scan" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000" opacity="0.18"/></pattern><filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff41" stop-opacity="0"/><stop offset=".85" stop-color="#00ff41" stop-opacity=".09"/><stop offset="1" stop-color="#9cff93" stop-opacity=".22"/></linearGradient><linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="seg" width="10" height="16" patternUnits="userSpaceOnUse" x="130"><rect x="8" width="2" height="16" fill="#0e0e0e"/></pattern><clipPath id="lit"><rect x="130" y="57" width="552.0" height="16"/><rect x="130" y="87" width="528.0" height="16"/><rect x="130" y="117" width="516.0" height="16"/><rect x="130" y="147" width="504.0" height="16"/><rect x="130" y="177" width="468.0" height="16"/><rect x="130" y="207" width="444.0" height="16"/><rect x="130" y="237" width="420.0" height="16"/><rect x="130" y="267" width="348.0" height="16"/></clipPath></defs><style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 700ms cubic-bezier(.2,.8,.2,1) both}@keyframes shine{0%{transform:translateX(0)}45%,100%{transform:translateX(690px)}}.shine{animation:shine 4.5s ease-in-out 1.4s infinite}@keyframes beam{from{transform:translateY(-70px)}to{transform:translateY(306px)}}.beam{animation:beam 9s linear 1s infinite}@keyframes flick{0%{opacity:.985}50%{opacity:1}100%{opacity:.99}}.flick{animation:flick .12s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="840" height="306" fill="#0e0e0e"/><g class="flick" filter="url(#bloom)"><text x="16" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15"><tspan fill="#fcaf00">&gt;&#160;</tspan><tspan fill="#9cff93">cat stack.txt</tspan></text><text x="16" y="70" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">Python</text><rect x="130" y="57" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="57" width="552.0" height="16" fill="#9cff93" style="animation-delay:0ms"/><text x="16" y="100" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">SQL</text><rect x="130" y="87" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="87" width="528.0" height="16" fill="#9cff93" style="animation-delay:90ms"/><text x="16" y="130" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">RAG / LLM</text><rect x="130" y="117" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="117" width="516.0" height="16" fill="#9cff93" style="animation-delay:180ms"/><text x="16" y="160" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">Power BI</text><rect x="130" y="147" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="147" width="504.0" height="16" fill="#9cff93" style="animation-delay:270ms"/><text x="16" y="190" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">Azure</text><rect x="130" y="177" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="177" width="468.0" height="16" fill="#9cff93" style="animation-delay:360ms"/><text x="16" y="220" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">PySpark</text><rect x="130" y="207" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="207" width="444.0" height="16" fill="#9cff93" style="animation-delay:450ms"/><text x="16" y="250" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">Docker</text><rect x="130" y="237" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="237" width="420.0" height="16" fill="#9cff93" style="animation-delay:540ms"/><text x="16" y="280" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">React</text><rect x="130" y="267" width="600" height="16" fill="#1a1919"/><rect class="bar" x="130" y="267" width="348.0" height="16" fill="#9cff93" style="animation-delay:630ms"/><g clip-path="url(#lit)"><rect class="shine" x="40" y="57" width="90" height="226" fill="url(#shineg)"/></g><rect x="130" y="57" width="600" height="226" fill="url(#seg)"/></g><rect class="beam" y="-70" width="840" height="70" fill="url(#beamg)" pointer-events="none"/><rect width="840" height="306" fill="url(#scan)" pointer-events="none"/></svg>