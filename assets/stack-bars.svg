<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-labelledby="svg-title"><title id="svg-title">Stack técnico de Domingo Berbel</title><defs><pattern id="scan" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000" opacity="0.18"/></pattern><filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 700ms cubic-bezier(.2,.8,.2,1) both}@keyframes flick{0%{opacity:.985}50%{opacity:1}100%{opacity:.99}}.flick{animation:flick .12s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="840" height="260" fill="#0e0e0e"/><g class="flick" filter="url(#bloom)"><text x="16" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14"><tspan fill="#fcaf00">&gt;&#160;</tspan><tspan fill="#9cff93">cat stack.txt</tspan></text><text x="16" y="64" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">Python</text><rect x="130" y="54" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="54" width="552.0" height="12" fill="#9cff93" style="animation-delay:0ms"/><text x="16" y="88" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">SQL</text><rect x="130" y="78" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="78" width="528.0" height="12" fill="#9cff93" style="animation-delay:90ms"/><text x="16" y="112" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">RAG / LLM</text><rect x="130" y="102" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="102" width="516.0" height="12" fill="#9cff93" style="animation-delay:180ms"/><text x="16" y="136" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">Power BI</text><rect x="130" y="126" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="126" width="504.0" height="12" fill="#9cff93" style="animation-delay:270ms"/><text x="16" y="160" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">Azure</text><rect x="130" y="150" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="150" width="468.0" height="12" fill="#9cff93" style="animation-delay:360ms"/><text x="16" y="184" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">PySpark</text><rect x="130" y="174" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="174" width="444.0" height="12" fill="#9cff93" style="animation-delay:450ms"/><text x="16" y="208" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">Docker</text><rect x="130" y="198" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="198" width="420.0" height="12" fill="#9cff93" style="animation-delay:540ms"/><text x="16" y="232" fill="#fcaf00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">React</text><rect x="130" y="222" width="600" height="12" fill="#1a1919"/><rect class="bar" x="130" y="222" width="348.0" height="12" fill="#9cff93" style="animation-delay:630ms"/></g><rect width="840" height="260" fill="url(#scan)" pointer-events="none"/></svg>