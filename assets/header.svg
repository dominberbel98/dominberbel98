<svg xmlns="http://www.w3.org/2000/svg" width="840" height="96" viewBox="0 0 840 96" role="img" aria-labelledby="svg-title"><title id="svg-title">Domingo Berbel — domingoberbel.com</title><defs><pattern id="scan" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#000" opacity="0.18"/></pattern><filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}.type{animation:type 1.1s steps(32, end) both}@keyframes enter{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}.ln{animation:enter 420ms cubic-bezier(.2,.8,.2,1) both}.l0{animation-delay:1150ms}.l1{animation-delay:1270ms}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1s step-end infinite}@keyframes flick{0%{opacity:.985}50%{opacity:1}100%{opacity:.99}}.flick{animation:flick .12s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="840" height="96" fill="#0e0e0e"/><rect x="0" y="95" width="840" height="1" fill="#484847"/><g class="flick" filter="url(#bloom)"><text class="type" x="16" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" xml:space="preserve"><tspan fill="#fcaf00">&gt; </tspan><tspan fill="#9cff93">open </tspan><tspan fill="#81ecff">https://domingoberbel.com</tspan></text><rect x="322" y="21" width="9" height="17" fill="#9cff93" class="cur"/><text class="ln l0" x="16" y="62" fill="#9cff93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">Data Scientist shipping ML, RAG and AI agents to production.</text><text class="ln l1" x="16" y="80" fill="#adaaaa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">Data Scientist que lleva ML, RAG y agentes de IA a producción.</text></g><rect width="840" height="96" fill="url(#scan)" pointer-events="none"/></svg>